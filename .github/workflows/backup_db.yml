name: Export Neon Database

on:
  workflow_dispatch:

jobs:
  export-db:
    runs-on: ubuntu-latest
    steps:
      - name: Install PostgreSQL Client
        run: |
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Export Database from Neon
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set! Please go to GitHub Repository Settings -> Secrets and variables -> Actions, and add a secret named DATABASE_URL."
            exit 1
          fi

          # Strip -pooler for direct fast unpooled dump
          CLEAN_URL=$(echo "$DATABASE_URL" | sed 's/-pooler\./\./')

          echo "Exporting all tables and data from Neon DB..."
          pg_dump "$CLEAN_URL" --clean --if-exists --no-owner --no-privileges -f neon_dump.sql

          echo "Dump completed successfully. File size:"
          ls -lh neon_dump.sql

      - name: Upload Dump as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: neon_dump
          path: neon_dump.sql
          retention-days: 7
