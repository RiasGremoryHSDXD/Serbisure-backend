name: Deploy backend to DigitalOcean

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# No checkout action or GitHub write token is needed: the server fetches public main.
permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Run isolated Linux deployment tests without production credentials
        shell: bash
        env:
          VALIDATION_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$VALIDATION_SHA" =~ ^[0-9a-f]{40}$ ]]
          source_dir=$(mktemp -d "$RUNNER_TEMP/serbisure-deployment-check.XXXXXX")
          git -C "$source_dir" init
          git -C "$source_dir" fetch --depth=1 --no-tags \
            https://github.com/RiasGremoryHSDXD/Serbisure-backend.git "$VALIDATION_SHA"
          git -C "$source_dir" checkout --detach FETCH_HEAD
          [[ $(git -C "$source_dir" rev-parse HEAD) == "$VALIDATION_SHA" ]]
          bash "$source_dir/deploy/droplet/test_deploy.sh"

  deploy:
    needs: validate
    concurrency:
      group: serbisure-droplet-production
      cancel-in-progress: false
    # Opt in only AFTER the one-time server and secret setup is complete.
    if: github.ref == 'refs/heads/main' && vars.DROPLET_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Deploy the main commit using a restricted SSH key
        shell: bash
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          DROPLET_KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for variable in DROPLET_HOST DROPLET_SSH_KEY DROPLET_KNOWN_HOSTS; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing repository Actions secret: $variable"
              exit 1
            fi
          done
          [[ "$DROPLET_HOST" == '159.89.196.204' ]] || {
            echo '::error::DROPLET_HOST must match the configured production IP.'
            exit 1
          }
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          umask 077
          ssh_dir=$(mktemp -d "$RUNNER_TEMP/serbisure-ssh.XXXXXX")
          trap 'rm -f -- "$ssh_dir/id_ed25519" "$ssh_dir/known_hosts"; rmdir -- "$ssh_dir"' EXIT
          printf '%s\n' "$DROPLET_SSH_KEY" | tr -d '\r' > "$ssh_dir/id_ed25519"
          printf '%s\n' "$DROPLET_KNOWN_HOSTS" | tr -d '\r' > "$ssh_dir/known_hosts"
          ssh-keygen -y -P '' -f "$ssh_dir/id_ed25519" > /dev/null
          # Never trust an unverified ssh-keyscan result or disable host-key checking.
          ssh -T \
            -i "$ssh_dir/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o GlobalKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=6 \
            "serbisure-deploy@$DROPLET_HOST" "$DEPLOY_SHA"
