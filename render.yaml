# One ASGI web service for the REST API and WebSockets; no separate paid worker.
# Review this Blueprint in Render before applying it. Existing database/AI credentials stay private.
services:
  - type: web
    name: serbisure-backend
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "uvicorn Serbisure.asgi:application --host 0.0.0.0 --port $PORT --workers 1 --proxy-headers --ws-max-size 4096 --ws-ping-interval 25 --ws-ping-timeout 25"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: Serbisure.settings
      - key: DJANGO_DEBUG
        value: "false"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REALTIME_ALLOWED_ORIGINS
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: serbisure-realtime-cache
          property: connectionString
  - type: keyvalue
    name: serbisure-realtime-cache
    plan: free
    region: singapore
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
